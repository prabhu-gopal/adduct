[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adduct"
dynamic = ["version"]
description = "The health check-up for robot-learning datasets. Find the hidden defects before you train."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adduct" }]
keywords = [
  "robotics", "imitation-learning", "dataset", "data-quality",
  "lerobot", "robot-learning", "data-validation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# --- Core: CPU-only, no ML weights, no network (see docs/02_ARCHITECTURE.md §8). ---
# P0 imports only this lean set. The Arrow tabular stack (polars/duckdb/pyarrow) and
# the format libs (h5py/zarr/scipy/sklearn) land in P1 when code actually uses them —
# we do not ship a dependency before a line imports it.
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "rich>=13.7",
  "pyyaml>=6.0",
  "polars>=1.0",   # Arrow-backed tabular layer: reads LeRobot Parquet out-of-core (docs/09 §1)
  "scikit-learn>=1.4",  # kNN graph, ridge dynamics fit, KMeans/GMM (CPU-only, no weights)
  "huggingface-hub>=0.23",  # `adduct scan owner/name` — the only network call in the tool
  "typing_extensions>=4.6; python_version < '3.11'",  # typing.Self backport
]

[project.optional-dependencies]
# Heavy/optional extras — a proprio-only LeRobot user never pulls any of these.
rlds = ["tensorflow>=2.15", "tensorflow-datasets>=4.9"]
hdf5 = ["h5py>=3.10"]
zarr = ["zarr>=2.17"]
video = ["av>=12.0"]
vision = ["torch>=2.2", "torchvision>=0.17"]
ann = ["faiss-cpu>=1.8"]
onnx = ["onnxruntime>=1.17"]
llm = ["httpx>=0.27"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "types-PyYAML>=6.0",
  "h5py>=3.10",
  "zarr>=2.17",
  "av>=12.0",
  "scipy>=1.11",  # reference implementation the KS-statistic tests check against; never imported by adduct itself
]

[project.urls]
Homepage = "https://adduct.com"
Documentation = "https://adduct.com/docs"
Source = "https://github.com/prabhu-gopal/adduct"

[project.scripts]
adduct = "adduct.cli:_run"

# --- The extensibility seams (docs/02_ARCHITECTURE.md §10). Built-ins register through
# the SAME entry-point groups a third-party plugin uses — no privileged path. ---
[project.entry-points."adduct.adapters"]
lerobot_v21 = "adduct.adapters.lerobot:LeRobotV21Adapter"
lerobot_v3 = "adduct.adapters.lerobot:LeRobotV3Adapter"
robomimic_hdf5 = "adduct.adapters.hdf5:RobomimicHdf5Adapter"
raw_hdf5 = "adduct.adapters.hdf5:RawHdf5Adapter"
zarr_replaybuffer = "adduct.adapters.zarr_replay:ZarrReplayBufferAdapter"
numpy_dir = "adduct.adapters.numpy_dir:NumpyDirAdapter"
rlds = "adduct.adapters.rlds:RldsAdapter"

[project.entry-points."adduct.detectors"]
# P3 additions - the remaining catalogued checks
"integrity.split_leakage" = "adduct.detectors.integrity:SplitLeakageDetector"
"stats.constant_or_degenerate_channel" = "adduct.detectors.scale:ConstantOrDegenerateChannelDetector"
"stats.unit_scale_inconsistency" = "adduct.detectors.scale:UnitScaleInconsistencyDetector"
"smoothness.path_efficiency" = "adduct.detectors.kinematics:PathEfficiencyDetector"
"smoothness.curvature" = "adduct.detectors.kinematics:CurvatureDetector"
"temporal.gripper_chatter" = "adduct.detectors.kinematics:GripperChatterDetector"
"temporal.non_markovian_pause" = "adduct.detectors.kinematics:NonMarkovianPauseDetector"
"vision.compression_artifacts" = "adduct.detectors.vision:CompressionArtifactsDetector"
# POLICY<->DATA (Family J) - inert unless --policy is supplied
"policy_data.dim_mismatch" = "adduct.detectors.policy_data:DimMismatchDetector"
"policy_data.missing_proprio" = "adduct.detectors.policy_data:MissingProprioDetector"
"policy_data.normalization_mismatch" = "adduct.detectors.policy_data:NormalizationMismatchDetector"
"policy_data.action_space_mismatch" = "adduct.detectors.policy_data:ActionSpaceMismatchDetector"
"policy_data.ood_estimate" = "adduct.detectors.policy_data:OodEstimateDetector"
# INTEGRITY (Family A)
"integrity.nan_inf" = "adduct.detectors.integrity:NanInfDetector"
"integrity.shape_dtype" = "adduct.detectors.integrity:ShapeDtypeDetector"
"integrity.timestamp_regularity" = "adduct.detectors.integrity:TimestampRegularityDetector"
"integrity.duplicate_frames" = "adduct.detectors.integrity:DuplicateFramesDetector"
"integrity.truncated_episodes" = "adduct.detectors.integrity:TruncatedEpisodesDetector"
"integrity.declared_mismatch" = "adduct.detectors.integrity:DeclaredMismatchDetector"
# STATS (Family B)
"stats.dead_dimension" = "adduct.detectors.stats:DeadDimensionDetector"
"stats.saturation_clipping" = "adduct.detectors.stats:SaturationClippingDetector"
"stats.normalization_outliers" = "adduct.detectors.stats:NormalizationOutliersDetector"
"stats.distribution_drift" = "adduct.detectors.stats:DistributionDriftDetector"
# COVERAGE (Family E) — the highest-value family
"coverage.mode_collapse" = "adduct.detectors.coverage:ModeCollapseDetector"
"coverage.initial_condition_diversity" = "adduct.detectors.coverage:InitialConditionDiversityDetector"
"coverage.redundancy" = "adduct.detectors.coverage:RedundancyDetector"
"coverage.scene_diversity" = "adduct.detectors.coverage:SceneDiversityDetector"
"coverage.task_imbalance" = "adduct.detectors.coverage:TaskImbalanceDetector"
# CONSISTENCY (Family F)
"consistency.operator_style" = "adduct.detectors.consistency:OperatorStyleDetector"
"consistency.trajectory_alignment" = "adduct.detectors.consistency:TrajectoryAlignmentDetector"
"consistency.duration_variance" = "adduct.detectors.consistency:DurationVarianceDetector"
# MULTIMODALITY (Family G)
"multimodality.contradictory_actions" = "adduct.detectors.multimodality:ContradictoryActionsDetector"
"multimodality.label_conflict" = "adduct.detectors.multimodality:LabelConflictDetector"
# VISION (Family H)
"vision.frozen_frames" = "adduct.detectors.vision:FrozenFramesDetector"
"vision.blur_exposure" = "adduct.detectors.vision:BlurExposureDetector"
"vision.camera_dropout" = "adduct.detectors.vision:CameraDropoutDetector"
"vision.viewpoint_drift" = "adduct.detectors.vision:ViewpointDriftDetector"
"vision.depth_pointcloud_quality" = "adduct.detectors.vision:DepthQualityDetector"
# LABEL (Family I)
"label.missing_or_empty" = "adduct.detectors.label:MissingLabelDetector"
"label.trajectory_label_mismatch" = "adduct.detectors.label:TrajectoryLabelMismatchDetector"
# DYNAMICS (Family K)
"dynamics.inverse_residual" = "adduct.detectors.dynamics:InverseResidualDetector"
"dynamics.forward_residual" = "adduct.detectors.dynamics:ForwardResidualDetector"
# SMOOTHNESS (Family C)
"smoothness.jerk_outlier" = "adduct.detectors.smoothness:JerkOutlierDetector"
"smoothness.discontinuity_jump" = "adduct.detectors.smoothness:DiscontinuityJumpDetector"
# TEMPORAL (Family D)
"temporal.idle_frames" = "adduct.detectors.temporal:IdleFramesDetector"
"temporal.action_observation_lag" = "adduct.detectors.temporal:ActionObservationLagDetector"
# CAUSAL (Family L)
"causal.copycat_shortcut" = "adduct.detectors.causal:CopycatShortcutDetector"
"causal.proprio_shortcut" = "adduct.detectors.causal:ProprioShortcutDetector"

[tool.hatch.version]
path = "src/adduct/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adduct"]

# ----------------------------------------------------------------------------------
# DoD gates: `ruff`, `mypy --strict`, `pytest` — all configured here, single source.
# ----------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pyflakes + pycodestyle
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "TID",              # tidy-imports
]
ignore = [
  "N818",             # exception names need not end in "Error"
  "RUF001",           # ambiguous unicode in strings — ×, →, ≥ are deliberate in user-facing text
  "RUF002",           # ambiguous unicode in docstrings — same reason
  "RUF003",           # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
# The 3.10 fallback deliberately uses the `str, Enum` mixin; UP042 would "fix" it into the
# very class it is standing in for. See src/adduct/_compat.py.
"src/adduct/_compat.py" = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["adduct"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "tests"
warn_unreachable = true
warn_redundant_casts = true

# scikit-learn and scipy ship no type information (no py.typed, no stubs on PyPI we depend
# on). Our own wrappers in adduct/analysis are fully typed, so the untyped surface is
# confined to these import sites.
[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "tqdm.*", "sklearn.*", "h5py.*", "zarr.*", "tensorflow_datasets.*", "tensorflow.*", "onnxruntime.*", "av", "av.*", "scipy.*", "torch.*", "faiss.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["adduct"]
branch = true
